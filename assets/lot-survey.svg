<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Top-down lot and house diagram for 1110 Richardine Avenue</title>
  <desc id="desc">A black-and-white survey-style diagram with the official parcel outline and approximate house footprint aligned from aerial imagery.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="0.9"/>
    </pattern>
  </defs>

  <rect width="760" height="500" fill="#fff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="58" y="42" font-size="18" font-weight="700">1110 RICHARDINE AVE</text>
    <text x="58" y="63" font-size="11">LOT 23, BLOCK 7, BROOKSDALE - PARCEL 193713</text>
  </g>

  <g transform="translate(0 6)" fill="none" stroke="#111" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M99.4 92 L652.7 131.5 L633.5 416.6 L80 380.6 L90.4 225.7 Z" stroke-width="3.2"/>
    <path d="M383.8 198.7 L506.2 198.7 L506.2 310.9 L383.8 310.9 Z" fill="url(#hatch)" stroke-width="2.4"/>

    <path d="M104 80 L648 119" stroke-width="1"/>
    <path d="M78 404 L628 440" stroke-width="1"/>
    <path d="M672 137 L652 410" stroke-width="1"/>
    <path d="M64 228 L76 379" stroke-width="1"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="450" y="262" font-size="14" text-anchor="middle" font-weight="700">HOUSE</text>
    <text x="450" y="281" font-size="10.5" text-anchor="middle">APPROX. 528 SF</text>

    <text x="371" y="112" font-size="11.5" text-anchor="middle" transform="rotate(4 371 112)">108.8 FT</text>
    <text x="357" y="448" font-size="11.5" text-anchor="middle" transform="rotate(4 357 448)">108.8 FT</text>
    <text x="690" y="278" font-size="11.5" text-anchor="middle" transform="rotate(94 690 278)">56.0 FT</text>
    <text x="48" y="304" font-size="11.5" text-anchor="middle" transform="rotate(86 48 304)">56.7 FT</text>
    <text x="718" y="278" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(90 718 278)">RICHARDINE AVE</text>
  </g>

  <g stroke="#111" stroke-width="1.5" fill="none">
    <path d="M658 74 L658 28"/>
    <path d="M658 28 L651 42 L665 42 Z" fill="#111"/>
    <text x="658" y="21" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111" text-anchor="middle">N</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <line x1="58" y1="466" x2="160" y2="466" stroke-width="2.5"/>
    <line x1="58" y1="458" x2="58" y2="474" stroke-width="1.7"/>
    <line x1="160" y1="458" x2="160" y2="474" stroke-width="1.7"/>
    <text x="109" y="488" font-size="11" stroke="none" text-anchor="middle">20 FT</text>
    <text x="224" y="466" font-size="11" stroke="none">LOT AREA: 6,132 SF / 0.1408 AC</text>
    <text x="224" y="486" font-size="10" stroke="none">PUBLIC GIS + AERIAL ESTIMATE. NOT A LEGAL SURVEY.</text>

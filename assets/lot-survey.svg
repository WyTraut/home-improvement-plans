<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Top-down lot and house diagram for 1110 Richardine Avenue</title>
  <desc id="desc">A square black-and-white planning diagram with Richardine Avenue along the bottom and the approximate house footprint inside the lot.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111" stroke-width="0.9"/>
    </pattern>
  </defs>

  <rect width="760" height="760" fill="#fff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="64" y="52" font-size="19" font-weight="700">1110 RICHARDINE AVE</text>
    <text x="64" y="76" font-size="12">LOT 23, BLOCK 7, BROOKSDALE - PARCEL 193713</text>
  </g>

  <g fill="none" stroke="#111" stroke-linejoin="miter" stroke-linecap="square">
    <path d="M252 610 L507 610 L509 115.1 L389.4 115.1 L251 115.1 Z" stroke-width="3.2"/>
    <rect x="331.2" y="374.7" width="107.2" height="115.7" fill="url(#hatch)" stroke-width="2.4"/>

    <path d="M252 632 L507 632" stroke-width="1.1"/>
    <path d="M229 610 L229 115.1" stroke-width="1.1"/>
    <path d="M531 610 L531 115.1" stroke-width="1.1"/>
    <path d="M251 94 L509 94" stroke-width="1.1"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="384.8" y="440" font-size="14" text-anchor="middle" font-weight="700">HOUSE</text>
    <text x="384.8" y="459" font-size="10.5" text-anchor="middle">APPROX. 528 SF</text>

    <text x="379.5" y="656" font-size="12" text-anchor="middle">56.0 FT FRONTAGE</text>
    <text x="379.5" y="84" font-size="12" text-anchor="middle">56.7 FT REAR</text>
    <text x="209" y="365" font-size="12" text-anchor="middle" transform="rotate(-90 209 365)">108.8 FT</text>
    <text x="552" y="365" font-size="12" text-anchor="middle" transform="rotate(90 552 365)">108.8 FT</text>
    <text x="379.5" y="698" font-size="18" font-weight="700" text-anchor="middle">RICHARDINE AVE</text>
  </g>

  <g stroke="#111" stroke-width="1.5" fill="none">
    <path d="M657 106 L657 60"/>
    <path d="M657 60 L650 74 L664 74 Z" fill="#111"/>
    <text x="657" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111" text-anchor="middle">N</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke="#111">
    <line x1="64" y1="700" x2="155" y2="700" stroke-width="2.5"/>
    <line x1="64" y1="692" x2="64" y2="708" stroke-width="1.7"/>
    <line x1="155" y1="692" x2="155" y2="708" stroke-width="1.7"/>
    <text x="109.5" y="723" font-size="11" stroke="none" text-anchor="middle">20 FT</text>
    <text x="64" y="735" font-size="10" stroke="none">LOT AREA: 6,132 SF / 0.1408 AC. PUBLIC GIS + AERIAL ESTIMATE. NOT A LEGAL SURVEY.</text>
  </g>
</svg>
